<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Gourmet - Login</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
         <img src="{{ url_for('static', filename='img/logosite.png') }}" alt="Logo Nexus Gourmet" class="logo">
    </div>
    
    <div class="login">
        <nav class="login-nav">
            <div class="login-header">
                <h1 class="login-text">Bem-vindo!</h1>
                <h2 class="login-text2">Login</h2>
            </div>
            
            <form action="/login" method="POST" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <div class="input-container">
                    <input type="text" name="login" placeholder="ID" class="input-field" required>
                    <input type="password" name="senha" placeholder="Password" class="input-field" required>
                </div>
                
                {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
                {% endif %}

                <div class="options">
                   <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Lembrar-me</label>
                   </div>
                   <div class="forgot-password">
                    <a href="#">Esqueci minha senha</a>
                   </div>
                </div>
                
                <button type="submit" class="login-button">Entrar</button>
            </form>
        </nav>
    </div>
</body>
</html>
