{% extends "base_admin.html" %}
{% block content %}

<h2 class="page-title">Gerenciar Produtos</h2>

<div class="card">
    <form action="/produtos/cadastrar" method="POST" class="form-row">
        <input type="text"   name="nome"      placeholder="Nome do produto"  required style="flex: 1; min-width: 160px;">
        <input type="number" step="0.01" name="preco" placeholder="Preço (R$)" required style="width: 120px;">
        <select name="categoria" style="width: 140px;">
            <option value="Bebida">Bebida</option>
            <option value="Prato">Prato</option>
            <option value="Sobremesa">Sobremesa</option>
        </select>
        <button type="submit">+ Cadastrar</button>
    </form>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th style="width: 60px;">ID</th> 
                <th>Produto</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th style="text-align: right;">Ação</th>
            </tr>
        </thead>
        <tbody>
            {% for produto in produtos %}
            <tr>
                <td style="font-family:'Rubik',sans-serif; font-size:11px; color: #555;">#{{ produto.id }}</td>
                
                <td>{{ produto.nome }}</td>
                <td style="color: var(--text-muted);">{{ produto.categoria.value }}</td>
                <td class="price-cell">R$ {{ "%.2f"|format(produto.preco) }}</td>
                <td style="text-align: right;">
                    <form action="/produtos/deletar/{{ produto.id }}" method="POST">
                        <button type="submit" class="danger">Excluir</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
