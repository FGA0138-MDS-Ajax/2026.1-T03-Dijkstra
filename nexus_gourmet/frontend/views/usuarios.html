{% extends "base_admin.html" %}
{% block content %}

<h2 class="page-title">Usuários do Sistema</h2>

<div class="card">
    <form action="/usuarios/cadastrar" method="POST" class="form-row">
        <input type="text"     name="nome"  placeholder="Nome Completo"   required style="flex: 1; min-width: 160px;">
        <input type="password" name="senha" placeholder="Senha"           required style="width: 140px;">
        <select name="cargo" style="width: 160px;">
            <option value="ADMINISTRADOR">Administrador</option>
            <option value="GARCOM">Garçom</option>
            <option value="COZINHEIRO">Cozinheiro</option>
        </select>
        <button type="submit">+ Cadastrar</button>
    </form>
</div>

<div class="grid-cards">
    {% for usuario in usuarios %}
    <div class="card">
        <h3>{{ usuario.nome }}</h3>
        <span class="status-badge">{{ usuario.cargo.value }}</span>
        <p style="font-family:'Rubik',sans-serif; font-size:11px; color: #555;">@{{ usuario.id }}</p>
        <form action="/usuarios/deletar_usuario/{{ usuario.id }}" method="POST" style="margin-top: 14px;">
    <button type="submit" class="danger" style="width: 100%;">Excluir</button>
</form>
    </div>
    {% endfor %}
</div>

{% endblock %}
